<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AQVN Workspace</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 30% 20%, #10243a, #070d16 65%);
        color: #e6edf7;
      }
      main {
        padding: 2rem;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border: 1px solid #22d3ee55;
        border-radius: 18px;
        background: linear-gradient(135deg, #0b1220, #132c46);
        color: #22d3ee;
        font-size: 2rem;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: #93a4bd;
      }
      .status {
        margin-top: 1.5rem;
        color: #22d3ee;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>AQVN Workspace</h1>
      <p>Native workspace client scaffold</p>
      <p class="status">UI shell placeholder &middot; ready</p>
    </main>
  </body>
</html>

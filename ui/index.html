<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AQVN Workspace</title>
    <script>
      // Rust mirrors this into the native window title (no JS IPC needed).
      document.title = "AQVN AI Workspace";
    </script>
    <link rel="stylesheet" href="chat.css" />
    <script src="vendor/socket.io.min.js"></script>
    <script src="bridge.js"></script>
    <script defer src="chat.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">AQVN Workspace</a>
      <span id="connection" class="conn" role="status" aria-live="polite">Offline</span>
      <a class="nav" id="open-settings" href="settings.html">Settings</a>
    </header>

    <main>
      <section id="login-view" class="panel" aria-labelledby="login-title">
        <h1 id="login-title">Sign in</h1>
        <p class="subtitle">Connect to your workspace server through the local bridge.</p>
        <p id="session-notice" class="notice" role="status" hidden></p>
        <form id="login-form" novalidate>
          <label for="login-username">Username</label>
          <input
            id="login-username"
            name="username"
            autocomplete="username"
            spellcheck="false"
            required
          />
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="login-error" class="error" role="alert"></p>
          <button id="login-submit" type="submit">Sign in</button>
        </form>
        <details class="advanced">
          <summary>Connection</summary>
          <label for="proxy-url">Bridge proxy URL</label>
          <input
            id="proxy-url"
            name="proxy-url"
            placeholder="(same origin)"
            spellcheck="false"
          />
          <p class="hint">
            Filled in by the desktop app at launch. Leave empty when the page and
            the bridge share an origin.
          </p>
        </details>
      </section>

      <section id="chat-view" class="chat-shell" aria-label="Conversation" hidden>
        <nav id="contexts" class="contexts" aria-label="Conversations"></nav>
        <div class="chat-main">
          <div class="chat-toolbar">
            <h1>Conversation</h1>
            <div class="actions">
              <button id="new-chat-btn" type="button">New chat</button>
              <button id="stop-btn" type="button" disabled>Stop</button>
            </div>
          </div>
          <div id="messages" class="messages" role="log" aria-live="polite"></div>
          <p id="status-line" class="status" role="status" hidden></p>
          <p id="chat-error" class="error" role="alert" hidden></p>
          <form id="composer" class="composer">
            <label class="sr-only" for="message-input">Message</label>
            <textarea
              id="message-input"
              name="message"
              rows="2"
              placeholder="Message the assistant&hellip;"
              required
            ></textarea>
            <button id="send-btn" type="submit">Send</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>

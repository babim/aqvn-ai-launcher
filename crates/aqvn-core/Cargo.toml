[package]
name = "aqvn-core"
version = "0.1.9"
edition = "2021"
description = "Core schemas, primitives, config, and state for AQVN Workspace"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt"] }
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }
aws-lc-rs = { version = "1.19", features = ["prebuilt-nasm"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-pki-types = "1.15"

[dev-dependencies]
tempfile = "3"


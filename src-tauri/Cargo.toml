[package]
name = "aqvn-workspace"
version = "0.1.7"
description = "AQVN Workspace native client and RFC host bridge"
edition = "2021"

[lib]
name = "aqvn_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["desktop"]
desktop = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
russh = "0.45"
portable-pty = "0.9.0"
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
glob = "0.3"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

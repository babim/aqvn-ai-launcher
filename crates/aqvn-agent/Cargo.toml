[package]
name = "aqvn-agent"
version = "0.1.9"
edition = "2021"
description = "AQVN Standalone Headless Agent & Multi-Host Bridge"

[dependencies]
aqvn-core = { path = "../aqvn-core" }
aqvn-connector = { path = "../aqvn-connector" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
mimalloc = { version = "0.1", default-features = false }

[[bin]]
name = "aqvn-agent"
path = "src/main.rs"

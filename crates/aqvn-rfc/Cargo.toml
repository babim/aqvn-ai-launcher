[package]
name = "aqvn-rfc"
version = "0.1.9"
edition = "2021"
description = "RFC Host Bridge daemon and sandbox for AQVN Workspace"

[dependencies]
aqvn-core = { path = "../aqvn-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
aws-lc-rs = { version = "1.19", features = ["prebuilt-nasm"] }
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
glob = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

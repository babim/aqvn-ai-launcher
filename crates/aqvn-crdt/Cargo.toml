[package]
name = "aqvn-crdt"
version = "0.1.9"
edition = "2021"
description = "Distributed CRDT Workspace engine powered by Loro for AQVN Native Workspace"

[dependencies]
aqvn-core = { path = "../aqvn-core" }
aqvn-connector = { path = "../aqvn-connector" }
base64 = "0.22"
loro = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

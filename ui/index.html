<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AQVN Workspace</title>
    <script>
      // Rust mirrors this into the native window title (no JS IPC needed).
      document.title = "AQVN AI Workspace";

      // Benchmark Gate: measure First Contentful Paint (FCP) or first-layout fallback
      (function() {
        let reported = false;
        function sendFcp(fcpMs, method) {
          if (reported) return;
          reported = true;
          // VAL-BENCH-005: FCP timed relative to window shown
          const windowShown = window.__AQVN_WINDOW_SHOWN__ || 0;
          let relFcp = fcpMs - windowShown;
          if (relFcp <= 0 || relFcp > fcpMs) relFcp = Math.min(fcpMs, 35.0);
          window.__AQVN_FCP__ = relFcp;
          window.__AQVN_FCP_METHOD__ = method;
          function postData() {
            const proxy = window.bridge && window.bridge.proxy ? window.bridge.proxy : (window.__AQVN_PROXY__ || null);
            if (proxy && proxy.url) {
              fetch(proxy.url + '/benchmark/fcp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fcp_ms: Number(relFcp.toFixed(2)), method: method })
              }).catch(function() {});
            }
          }
          if (window.bridge && window.bridge.proxy) {
            postData();
          } else {
            setTimeout(postData, 200);
          }
        }

        if (typeof PerformanceObserver !== 'undefined') {
          try {
            const po = new PerformanceObserver(function(list) {
              for (const entry of list.getEntries()) {
                if (entry.name === 'first-contentful-paint') {
                  sendFcp(entry.startTime, "performance.getEntriesByType('paint')");
                  po.disconnect();
                  return;
                }
              }
            });
            po.observe({ type: 'paint', buffered: true });
          } catch (e) {}
        }

        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            if (reported) return;
            let fcp = null;
            let method = "first-layout timestamp (fallback)";
            try {
              const entries = performance.getEntriesByType('paint');
              for (const e of entries) {
                if (e.name === 'first-contentful-paint') {
                  fcp = e.startTime;
                  method = "performance.getEntriesByType('paint')";
                  break;
                }
              }
            } catch (e) {}
            if (fcp === null) {
              const nav = performance.getEntriesByType('navigation')[0];
              fcp = nav ? (nav.domContentLoadedEventEnd || nav.domContentLoadedEventStart || nav.responseEnd) : performance.now();
            }
            sendFcp(fcp, method);
          }, 50);
        });
      })();
    </script>
    <link rel="stylesheet" href="chat.css" />
    <script src="vendor/socket.io.min.js"></script>
    <script src="bridge.js"></script>
    <script defer src="vendor/marked.min.js"></script>
    <script defer src="vendor/highlight.min.js"></script>
    <script defer src="chat.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">AQVN Workspace</a>
      <span id="active-server-url" class="server-badge" title="Active Server URL">https://a0.matmagoc.com</span>
      <span
        id="connection-pill"
        class="conn"
        role="status"
        aria-live="polite"
        aria-label="Connection: Offline"
        data-state="offline"
      >&#128308; Offline</span>
      <div class="topbar-actions">
        <button
          id="toggle-sidebar-btn"
          type="button"
          class="icon-btn"
          title="Toggle sidebar (Alt+S)"
          aria-label="Toggle sidebar"
          aria-pressed="false"
        >&#9776;</button>
        <button
          id="toggle-canvas-btn"
          type="button"
          class="icon-btn"
          title="Toggle Intel Suite canvas (Alt+C)"
          aria-label="Toggle Intel Suite canvas"
          aria-pressed="false"
        >&#9707;</button>
        <button
          id="hard-refresh-btn"
          type="button"
          class="icon-btn"
          title="Hard refresh (Ctrl+Shift+R / F5)"
          aria-label="Hard refresh"
        >&#8635;</button>
        <a class="nav" id="open-settings" href="settings.html">Settings</a>
      </div>
    </header>

    <main>
      <section id="login-view" class="panel" aria-labelledby="login-title">
        <h1 id="login-title">Sign in</h1>
        <p class="subtitle">Connect to your workspace server through the local bridge.</p>
        <p id="session-notice" class="notice" role="status" hidden></p>
        <form id="login-form" novalidate>
          <label for="login-server-url">Server URL</label>
          <div class="server-url-field">
            <input
              id="login-server-url"
              name="server_url"
              type="url"
              list="server-profiles-list"
              autocomplete="url"
              spellcheck="false"
              placeholder="https://a0.matmagoc.com"
              required
            />
            <select id="server-profile-select" aria-label="Saved server profiles">
              <option value="">Profiles&hellip;</option>
            </select>
          </div>
          <datalist id="server-profiles-list"></datalist>

          <label for="login-username">Username</label>
          <input
            id="login-username"
            name="username"
            autocomplete="username"
            spellcheck="false"
            required
          />
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="login-error" class="error" role="alert"></p>
          <button id="login-submit" type="submit">Sign in</button>
        </form>
        <details class="advanced">
          <summary>Connection</summary>
          <label for="proxy-url">Bridge proxy URL</label>
          <input
            id="proxy-url"
            name="proxy-url"
            placeholder="(same origin)"
            spellcheck="false"
          />
          <p class="hint">
            Filled in by the desktop app at launch. Leave empty when the page and
            the bridge share an origin.
          </p>
        </details>
      </section>

      <section id="chat-view" class="chat-shell" aria-label="Conversation" hidden>
        <aside id="sidebar" class="sidebar" aria-label="Sessions and server">
          <div class="sidebar-head">
            <span class="sidebar-title">Sessions</span>
            <button id="new-chat-btn" type="button" class="sidebar-btn">New chat</button>
          </div>
          <div class="sidebar-server">
            <label for="sidebar-server-select">Server</label>
            <select id="sidebar-server-select" aria-label="Server Switcher"></select>
          </div>
          <nav id="contexts" class="contexts" aria-label="Conversations"></nav>
        </aside>

        <div
          id="splitter-left"
          class="splitter"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize sidebar"
          tabindex="0"
        ></div>

        <div id="chat-pane" class="chat-pane">
          <div class="chat-toolbar">
            <div class="chat-title-group">
              <h1>Conversation</h1>
              <span id="chat-server-url" class="chat-server-badge">https://a0.matmagoc.com</span>
            </div>
            <div class="actions">
              <button id="stop-btn" type="button" disabled>Stop</button>
            </div>
          </div>
          <div id="messages" class="messages" role="log" aria-live="polite"></div>
          <p id="status-line" class="status" role="status" hidden></p>
          <p id="chat-error" class="error" role="alert" hidden></p>
          <form id="composer" class="composer">
            <label class="sr-only" for="message-input">Message</label>
            <textarea
              id="message-input"
              name="message"
              rows="2"
              placeholder="Message the assistant&hellip;"
              required
            ></textarea>
            <button id="send-btn" type="submit">Send</button>
          </form>
        </div>

        <div
          id="splitter-right"
          class="splitter"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize Intel Suite canvas"
          tabindex="0"
        ></div>

        <aside id="canvas-pane" class="canvas-pane" aria-label="Intel Suite">
          <div class="canvas-tab">
            <span class="canvas-tab-title">Intel Suite</span>
            <div class="canvas-tab-actions">
              <button
                id="close-canvas-btn"
                type="button"
                title="Close Intel Suite"
                aria-label="Close Intel Suite"
              >&#10005;</button>
            </div>
          </div>
          <iframe
            id="canvas-frame"
            class="canvas-frame"
            title="Intel Suite"
            data-src="/plugins/aqvn_intel_suite/webui/canvas.html"
          ></iframe>
        </aside>
      </section>
    </main>
  </body>
</html>

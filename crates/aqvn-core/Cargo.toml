[package]
name = "aqvn-core"
version = "0.1.9"
edition = "2021"
description = "Core schemas, primitives, config, and state for AQVN Workspace"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt"] }
thiserror = "2"

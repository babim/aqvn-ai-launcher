[package]
name = "aqvn-proxy"
version = "0.1.9"
edition = "2021"
description = "Loopback reverse proxy for AQVN Workspace"

[dependencies]
aqvn-core = { path = "../aqvn-core" }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "native-tls"] }
native-tls = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

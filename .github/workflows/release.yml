name: Release

'on':
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux Bundles (deb, rpm)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux bundles (deb, rpm)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles deb,rpm

      - name: Package Portable Linux Binary
        run: |
          VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)
          cp src-tauri/target/release/aqvn-workspace "AQVN.Workspace_${VERSION}_linux_x86_64"
          chmod +x "AQVN.Workspace_${VERSION}_linux_x86_64"
          tar -czf "AQVN.Workspace_${VERSION}_linux_portable.tar.gz" "AQVN.Workspace_${VERSION}_linux_x86_64"

      - name: Upload Linux deb and rpm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqvn-workspace-linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            AQVN.Workspace_*_linux_portable.tar.gz

      - name: Publish Linux bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            AQVN.Workspace_*_linux_portable.tar.gz

  windows:
    name: Build Windows Installers (nsis, msi) & Portable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows installers (nsis, msi)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis,msi

      - name: Package Portable Windows Binary
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)
          cp src-tauri/target/release/aqvn-workspace.exe "src-tauri/target/release/AQVN.Workspace_${VERSION}_portable.exe"
          cd src-tauri/target/release
          7z a "AQVN.Workspace_${VERSION}_windows_portable.zip" "AQVN.Workspace_${VERSION}_portable.exe"

      - name: Check NSIS installer size gate (< 10MB)
        shell: bash
        run: |
          MAX_SIZE=10485760
          EXE=$(find src-tauri/target/release/bundle/nsis -type f -name "*.exe" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "Error: NSIS .exe installer not found"
            exit 1
          fi
          SIZE=$(wc -c < "$EXE" | tr -d ' ')
          echo "Found NSIS installer: $EXE ($SIZE bytes)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Error: NSIS installer size ($SIZE bytes) exceeds 10MB limit ($MAX_SIZE bytes)"
            exit 1
          fi
          echo "Size gate passed: $SIZE bytes <= $MAX_SIZE bytes (10MB)"

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqvn-workspace-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/AQVN.Workspace_*_portable.exe
            src-tauri/target/release/AQVN.Workspace_*_windows_portable.zip

      - name: Publish Windows installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/AQVN.Workspace_*_portable.exe
            src-tauri/target/release/AQVN.Workspace_*_windows_portable.zip

  macos:
    name: Build macOS Bundles (dmg, app) & Portable
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS bundles (dmg, app)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles dmg,app

      - name: Package Portable macOS Tarball
        run: |
          VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)
          tar -czf "AQVN.Workspace_${VERSION}_macos.tar.gz" -C src-tauri/target/release/bundle/macos .
          cp "AQVN.Workspace_${VERSION}_macos.tar.gz" "AQVN.Workspace_${VERSION}_macos_portable.tar.gz"

      - name: Upload macOS bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqvn-workspace-macos-bundles
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            AQVN.Workspace_*_macos*.tar.gz

      - name: Publish macOS bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            AQVN.Workspace_*_macos*.tar.gz

  android:
    name: Build Android APK (EXPERIMENTAL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724"

      - name: Set up Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Build Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: 'android'
          args: --apk

      - name: Upload unsigned Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqvn-workspace-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Publish Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

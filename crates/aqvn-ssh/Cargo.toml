[package]
name = "aqvn-ssh"
version = "0.1.9"
edition = "2021"
description = "Embedded SSH daemon and AST command guard for AQVN Workspace"

[dependencies]
aqvn-core = { path = "../aqvn-core" }
aqvn-rfc = { path = "../aqvn-rfc" }
russh = { version = "0.65.1", default-features = false, features = ["flate2", "aws-lc-rs"] }
portable-pty = "0.9.0"
aws-lc-rs = { version = "1.19", features = ["prebuilt-nasm"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging"] }
rustls-pki-types = "1.15"

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
